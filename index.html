<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>8-bit Tetris</title>
  <style>
    body {
      background: #222;
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: 'Press Start 2P', monospace, Arial, sans-serif;
    }
    .tetris-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
    }
    canvas {
      background: #111;
      border: 4px solid #fff;
      image-rendering: pixelated;
      box-shadow: 0 0 32px #000a, 0 0 0 8px #444;
    }
    .controls {
      display: flex;
      gap: 16px;
      margin-top: 8px;
      flex-wrap: wrap;
      justify-content: center;
    }
    .btn {
      width: 56px;
      height: 56px;
      background: #333;
      border: 2px solid #fff;
      border-radius: 12px;
      color: #fff;
      font-size: 2rem;
      font-family: inherit;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 2px 0 #888;
      user-select: none;
      touch-action: manipulation;
      transition: background 0.1s;
    }
    .btn:active {
      background: #555;
    }
    .score {
      color: #fff;
      font-size: 1.2rem;
      margin-bottom: 4px;
      letter-spacing: 2px;
      text-shadow: 2px 2px 0 #000a;
    }
    @media (max-width: 600px) {
      canvas { width: 96vw !important; height: 160vw !important; max-width: 320px; max-height: 540px; }
      .btn { width: 44px; height: 44px; font-size: 1.5rem; }
    }
  </style>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script>
    // Telegram Web App готов к работе
    Telegram.WebApp.ready();
    Telegram.WebApp.expand();
  </script>
</head>
<body>
  <div class="tetris-container">
    <div class="score" id="score">SCORE: 0</div>
    <canvas id="tetris" width="160" height="320"></canvas>
    <div class="controls">
      <button class="btn" id="left" aria-label="Left">◀️</button>
      <button class="btn" id="rotate" aria-label="Rotate">🔄</button>
      <button class="btn" id="right" aria-label="Right">▶️</button>
      <button class="btn" id="down" aria-label="Down">⬇️</button>
    </div>
  </div>
  <script>
    // 8-bit Tetris core
    const canvas = document.getElementById('tetris');
    const context = canvas.getContext('2d');
    const scoreEl = document.getElementById('score');
    // Настройки поля
    const COLS = 10;
    const ROWS = 20;
    const BLOCK_SIZE = 24; // Крупнее блоки
    canvas.width = COLS * BLOCK_SIZE;
    canvas.height = ROWS * BLOCK_SIZE;
    // Масштабируем context, чтобы 1 логический блок = BLOCK_SIZE px
    context.setTransform(BLOCK_SIZE, 0, 0, BLOCK_SIZE, 0, 0);
    context.imageSmoothingEnabled = false;

    // 8-bit palette
    const colors = [
      null,
      '#FF595E', // Red
      '#FFCA3A', // Yellow
      '#8AC926', // Green
      '#1982C4', // Blue
      '#6A4C93', // Purple
      '#FF924C', // Orange
      '#00C2A0', // Cyan
    ];

    // Draw 8-bit block
    function drawBlock(x, y, color) {
      context.fillStyle = color;
      context.fillRect(x, y, 1, 1);
      context.strokeStyle = '#222';
      context.lineWidth = 0.08;
      context.strokeRect(x + 0.04, y + 0.04, 0.92, 0.92);
    }

    function drawMatrix(matrix, offset) {
      matrix.forEach((row, y) => {
        row.forEach((value, x) => {
          if (value) drawBlock(x + offset.x, y + offset.y, colors[value]);
        });
      });
    }

    function draw() {
      // BG
      context.fillStyle = '#111';
      context.fillRect(0, 0, canvas.width / BLOCK_SIZE, canvas.height / BLOCK_SIZE);
      drawMatrix(arena, {x:0, y:0});
      drawMatrix(player.matrix, player.pos);
    }

    function createMatrix(w, h) {
      const m = [];
      while (h--) m.push(new Array(w).fill(0));
      return m;
    }

    function createPiece(type) {
      if (type === 'T') return [ [0,0,0],[1,1,1],[0,1,0] ];
      if (type === 'O') return [ [2,2],[2,2] ];
      if (type === 'L') return [ [0,3,0],[0,3,0],[0,3,3] ];
      if (type === 'J') return [ [0,4,0],[0,4,0],[4,4,0] ];
      if (type === 'I') return [ [0,5,0,0],[0,5,0,0],[0,5,0,0],[0,5,0,0] ];
      if (type === 'S') return [ [0,6,6],[6,6,0],[0,0,0] ];
      if (type === 'Z') return [ [7,7,0],[0,7,7],[0,0,0] ];
    }

    function merge(arena, player) {
      player.matrix.forEach((row, y) => {
        row.forEach((value, x) => {
          if (value) arena[y + player.pos.y][x + player.pos.x] = value;
        });
      });
    }

    function collide(arena, player) {
      const [m, o] = [player.matrix, player.pos];
      for (let y = 0; y < m.length; ++y) {
        for (let x = 0; x < m[y].length; ++x) {
          if (m[y][x] && (arena[y + o.y] && arena[y + o.y][x + o.x]) !== 0) {
            return true;
          }
        }
      }
      return false;
    }

    function arenaSweep() {
      let rowCount = 1;
      outer: for (let y = arena.length - 1; y >= 0; --y) {
        for (let x = 0; x < arena[y].length; ++x) {
          if (!arena[y][x]) continue outer;
        }
        const row = arena.splice(y, 1)[0].fill(0);
        arena.unshift(row);
        ++y;
        player.score += rowCount * 100;
        rowCount *= 2;
      }
    }

    function playerDrop() {
      player.pos.y++;
      if (collide(arena, player)) {
        player.pos.y--;
        merge(arena, player);
        playerReset();
        arenaSweep();
        updateScore();
      }
      dropCounter = 0;
    }

    function playerMove(dir) {
      player.pos.x += dir;
      if (collide(arena, player)) player.pos.x -= dir;
    }

    function playerReset() {
      const pieces = 'TJLOSZI';
      player.matrix = createPiece(pieces[Math.random() * pieces.length | 0]);
      player.pos.y = 0;
      player.pos.x = (arena[0].length / 2 | 0) - (player.matrix[0].length / 2 | 0);
      if (collide(arena, player)) {
        arena.forEach(row => row.fill(0));
        player.score = 0;
        updateScore();
      }
    }

    function playerRotate(dir) {
      const pos = player.pos.x;
      let offset = 1;
      rotate(player.matrix, dir);
      while (collide(arena, player)) {
        player.pos.x += offset;
        offset = -(offset + (offset > 0 ? 1 : -1));
        if (offset > player.matrix[0].length) {
          rotate(player.matrix, -dir);
          player.pos.x = pos;
          return;
        }
      }
    }

    function rotate(matrix, dir) {
      for (let y = 0; y < matrix.length; ++y) {
        for (let x = 0; x < y; ++x) {
          [matrix[x][y], matrix[y][x]] = [matrix[y][x], matrix[x][y]];
        }
      }
      if (dir > 0) matrix.forEach(row => row.reverse());
      else matrix.reverse();
    }

    function updateScore() {
      scoreEl.textContent = 'SCORE: ' + player.score;
    }

    // Game loop
    let dropCounter = 0;
    let dropInterval = 700;
    let lastTime = 0;
    const arena = createMatrix(COLS, ROWS);
    const player = { pos: {x:0, y:0}, matrix: null, score: 0 };

    function update(time = 0) {
      const deltaTime = time - lastTime;
      lastTime = time;
      dropCounter += deltaTime;
      if (dropCounter > dropInterval) playerDrop();
      draw();
      requestAnimationFrame(update);
    }

    // Мобильная адаптация canvas
    function resizeCanvas() {
      const maxW = Math.min(window.innerWidth * 0.96, 320);
      const maxH = Math.min(window.innerHeight * 0.7, 540);
      const scaleW = Math.floor(maxW / COLS);
      const scaleH = Math.floor(maxH / ROWS);
      const size = Math.max(16, Math.min(scaleW, scaleH));
      canvas.style.width = (COLS * size) + 'px';
      canvas.style.height = (ROWS * size) + 'px';
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    // Touch & button controls
    document.getElementById('left').addEventListener('touchstart', e => { e.preventDefault(); playerMove(-1); });
    document.getElementById('right').addEventListener('touchstart', e => { e.preventDefault(); playerMove(1); });
    document.getElementById('down').addEventListener('touchstart', e => { e.preventDefault(); playerDrop(); });
    document.getElementById('rotate').addEventListener('touchstart', e => { e.preventDefault(); playerRotate(1); });
    // Mouse fallback
    document.getElementById('left').addEventListener('mousedown', () => playerMove(-1));
    document.getElementById('right').addEventListener('mousedown', () => playerMove(1));
    document.getElementById('down').addEventListener('mousedown', () => playerDrop());
    document.getElementById('rotate').addEventListener('mousedown', () => playerRotate(1));
    // Keyboard
    document.addEventListener('keydown', event => {
      if (event.key === 'ArrowLeft') playerMove(-1);
      else if (event.key === 'ArrowRight') playerMove(1);
      else if (event.key === 'ArrowDown') playerDrop();
      else if (event.key === ' ' || event.key === 'ArrowUp') playerRotate(1);
    });

    playerReset();
    updateScore();
    update();
  </script>
</body>
</html>
